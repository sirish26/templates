<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Link-in-Bio</title>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f0f0f0;
            font-family: 'Public Sans', sans-serif;
            display: flex;
            justify-content: center;
            padding: 2rem;
            color: #000;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .card {
            border: 4px solid #000;
            border-radius: 0;
            box-shadow: 8px 8px 0 #000;
            background: #fff;
            padding: 2rem;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .card:hover {
            transform: translate(2px, 2px);
            box-shadow: 6px 6px 0 #000;
        }

        .profile-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: #fff;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border: 4px solid #000;
            background: #ff5757;
            border-radius: 50%;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2rem;
            margin: 0 0 0.5rem 0;
        }

        p {
            font-size: 1.1rem;
            margin: 0;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .link-card {
            text-decoration: none;
            color: #000;
            font-weight: 900;
            font-size: 1.2rem;
            text-align: center;
            padding: 1.5rem;
            display: block;
            cursor: pointer;
        }

        .link-card:active {
            transform: translate(8px, 8px);
            box-shadow: 0 0 0 #000;
        }

        .yellow { background-color: #ffde59; }
        .red { background-color: #ff5757; }
        .cyan { background-color: #5ce1e6; }
    </style>
</head>
<body>
    <main class="container">
        <div class="profile-card card">
            <div class="avatar"></div>
            <h1>Creator Name</h1>
            <p>I build things on the internet.</p>
        </div>

        <div class="links-container">
            <a href="https://youtube.com" target="_blank" class="link-card card yellow">
                My Latest Video
            </a>
            <a href="https://twitter.com" target="_blank" class="link-card card red">
                Join the Newsletter
            </a>
            <a href="https://github.com" target="_blank" class="link-card card cyan">
                Buy my Course
            </a>
        </div>
    </main>
</body>
</html>
