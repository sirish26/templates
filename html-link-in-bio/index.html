<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f0f0f0; --fg: #000; --card: #fff; --accent: #ff5757; }
        [data-theme="dark"] { --bg: #111; --fg: #fff; --card: #222; --accent: #ffde59; }
        
        body { background-color: var(--bg); color: var(--fg); font-family: 'Public Sans', sans-serif; display: flex; justify-content: center; padding: 2rem; transition: background 0.2s; }
        .container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 2rem; }
        .card { border: 4px solid var(--fg); box-shadow: 8px 8px 0 var(--fg); background: var(--card); padding: 2rem; transition: transform 0.1s, box-shadow 0.1s; }
        
        .tabs { display: flex; gap: 0.5rem; }
        .tab { flex: 1; padding: 1rem; text-align: center; font-weight: 900; border: 4px solid var(--fg); background: var(--card); color: var(--fg); cursor: pointer; }
        .tab.active { background: var(--fg); color: var(--bg); }
        
        .tab-content { display: none; flex-direction: column; gap: 1rem; }
        .tab-content.active { display: flex; }

        .link-card { text-decoration: none; color: #000; font-weight: 900; font-size: 1.2rem; text-align: center; padding: 1.5rem; display: block; cursor: pointer; border: 4px solid #000; box-shadow: 6px 6px 0 #000; }
        .link-card:active { transform: translate(6px, 6px); box-shadow: 0 0 0 #000; }
        
        .theme-toggle { position: fixed; top: 1rem; right: 1rem; background: var(--fg); color: var(--bg); padding: 0.5rem 1rem; border: none; font-weight: 900; cursor: pointer; }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">TOGGLE THEME</button>
    <main class="container">
        <div class="card" style="text-align: center;">
            <div style="width: 100px; height: 100px; border: 4px solid var(--fg); background: var(--accent); border-radius: 50%; margin: 0 auto 1rem;"></div>
            <h1 style="margin:0 0 0.5rem; font-size:2rem;">Creator Name</h1>
            <p style="margin:0;">I build things on the internet.</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('links')">LINKS</button>
            <button class="tab" onclick="switchTab('store')">STORE</button>
        </div>

        <div id="links" class="tab-content active">
            <a href="#" class="link-card" style="background:#ffde59;">My Latest Video</a>
            <a href="#" class="link-card" style="background:#ff5757;">Join Newsletter</a>
            <a href="#" class="link-card" style="background:#5ce1e6;">Follow on X</a>
        </div>

        <div id="store" class="tab-content">
            <div class="card" style="padding:1rem;">
                <div style="background:#ccc; height:150px; border:4px solid var(--fg); margin-bottom:1rem;"></div>
                <h3 style="margin:0 0 0.5rem;">Web Design Course</h3>
                <p style="margin:0 0 1rem;">Learn to build premium sites.</p>
                <button class="link-card" style="width:100%; background:var(--fg); color:var(--bg); border-color:var(--bg); padding:1rem;">BUY - $99</button>
            </div>
        </div>
    </main>
    <script>
        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.target.classList.add('active');
        }
        function toggleTheme() {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }
        if (localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');
    </script>
</body>
</html>
