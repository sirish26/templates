<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Link-in-Bio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
    <main class="container">
        <div class="profile-card card">
            <div class="avatar"></div>
            <h1>Creator Name</h1>
            <p>I build things on the internet.</p>
        </div>

        <div class="links-container">
            <a href="#" class="link-card card yellow">
                My Latest Video
            </a>
            <a href="#" class="link-card card red">
                Join the Newsletter
            </a>
            <a href="#" class="link-card card cyan">
                Buy my Course
            </a>
        </div>
    </main>
</body>
</html>
