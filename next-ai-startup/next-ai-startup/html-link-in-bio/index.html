<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #FFF3E0; --fg: #000; --accent: #FF5722; --accent2: #4CAF50; --accent3: #2196F3; }
        body { background: var(--bg); color: var(--fg); font-family: 'Space Grotesk', sans-serif; display: flex; justify-content: center; padding: 2rem; margin:0;}
        
        .container { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 2rem; }
        
        .card { 
            border: 4px solid var(--fg); box-shadow: 8px 8px 0 var(--fg); 
            background: #fff; padding: 2rem; border-radius: 16px;
        }
        
        .avatar {
            width: 120px; height: 120px; border: 4px solid var(--fg); border-radius: 50%;
            background: var(--accent); margin: 0 auto 1.5rem; display: block;
            box-shadow: 4px 4px 0 var(--fg);
        }
        
        .nav { display: flex; gap: 1rem; flex-wrap: wrap; }
        .nav a { 
            flex: 1; padding: 1rem; text-align: center; font-weight: 700; 
            border: 4px solid var(--fg); background: #fff; color: var(--fg); 
            text-decoration: none; border-radius: 12px;
            box-shadow: 4px 4px 0 var(--fg); transition: all 0.1s;
        }
        .nav a.active { background: var(--fg); color: #fff; box-shadow: 0 0 0 var(--fg); transform: translate(4px, 4px); }
        
        .link-card { 
            display: flex; align-items: center; justify-content: space-between;
            padding: 1.5rem; font-weight: 700; font-size: 1.2rem;
            color: var(--fg); border: 4px solid var(--fg); text-decoration: none; 
            box-shadow: 6px 6px 0 var(--fg); border-radius: 12px;
            margin-bottom: 1rem; background: #fff; transition: all 0.1s;
        }
        .link-card:active { transform: translate(6px, 6px); box-shadow: 0 0 0 var(--fg); }
        
    </style>
</head>
<body>
    <main class="container">
        <div class="card" style="text-align: center;">
            <div class="avatar"></div>
            <h1 style="margin:0 0 0.5rem; font-size:2.5rem; text-transform: uppercase; font-weight: 700;">Alex Studio</h1>
            <p style="margin:0; font-size: 1.2rem; font-weight: 500;">Designer & Developer</p>
        </div>
        
        <div class="nav">
            <a href="index.html" class="active">Links</a>
            <a href="store.html">Store</a>
        </div>
        
        <div>
            <a href="#" class="link-card" style="background: var(--accent2);">
                <span>Read the Blog</span>
                <span style="font-size: 1.5rem;">→</span>
            </a>
            <a href="#" class="link-card" style="background: var(--accent3);">
                <span>YouTube Channel</span>
                <span style="font-size: 1.5rem;">→</span>
            </a>
            <a href="#" class="link-card" style="background: #fff;">
                <span>Follow on X</span>
                <span style="font-size: 1.5rem;">→</span>
            </a>
        </div>
    </main>
</body>
</html>
